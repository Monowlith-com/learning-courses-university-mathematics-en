<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Forward kinematics of a two-link arm</title><desc>Planar arm model with first link of length two pointing horizontally right and second link of length one pointing vertically upwards. End effector at (2,1). Joint angles q₁=0 and q₂=90°.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Forward kinematics of a two-link arm</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">l₁ = 2, l₂ = 1, q₁ = 0, q₂ = 90°</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="100.00" y1="487.00" x2="730.00" y2="487.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="205.00" y1="536.00" x2="205.00" y2="146.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><text x="720" y="514" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x</text><text x="218" y="151" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">y</text><line x1="205.00" y1="487.00" x2="467.00" y2="487.00" stroke="#286fba" stroke-width="12" stroke-linecap="round" /><line x1="467.00" y1="487.00" x2="467.00" y2="356.00" stroke="#bc6924" stroke-width="12" stroke-linecap="round" /><circle cx="205.00" cy="487.00" r="13" fill="#ffffff" stroke="#286fba" stroke-width="3" /><circle cx="467.00" cy="487.00" r="13" fill="#ffffff" stroke="#286fba" stroke-width="3" /><circle cx="467.00" cy="356.00" r="10" fill="#ffffff" stroke="#bc6924" stroke-width="3" /><polyline points="443.00,487.00 443.00,463.00 467.00,463.00" fill="none" stroke="#61758a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="493" y="464" fill="#bc6924" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">q₂ = 90°</text><text x="307" y="530" fill="#286fba" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">l₁ = 2</text><text x="489" y="412" fill="#bc6924" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">l₂ = 1</text><line x1="467.00" y1="356.00" x2="467.00" y2="487.00" stroke="#61758a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" /><text x="487" y="339" fill="#253d59" font-size="21" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">P = (2, 1)</text><text x="100" y="554" fill="#253d59" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x = l₁ cos q₁ + l₂ cos(q₁ + q₂) = 2</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">y = l₁ sin q₁ + l₂ sin(q₁ + q₂) = 1    (schematic, lengths proportional).</text></svg>