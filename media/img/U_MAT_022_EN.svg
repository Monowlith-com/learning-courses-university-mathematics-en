<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A node aggregates features from its immediate neighbours to form a new representation."><title>Graph network: gathering information</title><desc>A node aggregates features from its immediate neighbours to form a new representation.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Graph network: gathering information</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="236" y="161" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#586b84">Before: neighbourhood</text><circle cx="230" cy="318" r="37" fill="#dfecfb" stroke="#356dda" stroke-width="3"/><text x="230" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356dda">v</text><line x1="112" y1="226" x2="230" y2="318" stroke="#586b84" stroke-width="3" stroke-linecap="round"/><circle cx="112" cy="226" r="37" fill="#e3f3ef" stroke="#15978f" stroke-width="3"/><text x="112" y="234" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#15978f">a</text><line x1="339" y1="227" x2="230" y2="318" stroke="#586b84" stroke-width="3" stroke-linecap="round"/><circle cx="339" cy="227" r="37" fill="#e3f3ef" stroke="#15978f" stroke-width="3"/><text x="339" y="235" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#15978f">b</text><line x1="328" y1="418" x2="230" y2="318" stroke="#586b84" stroke-width="3" stroke-linecap="round"/><circle cx="328" cy="418" r="37" fill="#e3f3ef" stroke="#15978f" stroke-width="3"/><text x="328" y="426" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#15978f">c</text><line x1="430" y1="317" x2="535" y2="317" stroke="#ee9a32" stroke-width="5" stroke-linecap="round"/><polygon points="535.0,317.0 524.4,322.5 524.4,311.5" fill="#ee9a32"/><rect x="556" y="227" width="325" height="185" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="718" y="267" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#192b47">Aggregation</text><text x="718" y="307" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356dda">hᵥ′ = Update(</text><text x="718" y="339" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#15978f">hᵥ, Agg(hₐ, hᵦ, h𝒸))</text><text x="718" y="380" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">New node features</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Aggregation should not depend on an arbitrary ordering of neighbours.</text></svg>