<text x="592" y="357" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">C</text>
<circle cx="798" cy="242" r="30" fill="#EAF4FF" stroke="#2976BD" stroke-width="3"/>
