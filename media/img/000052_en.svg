<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Directed graph with edges A to B of weight 2, A to C of weight 5, B to C of weight 1, B to D of weight 4 and C to D of weight 1. The shortest path A B C D costs 4.">
<title>Directed, weighted graph</title>
<desc>Directed graph with edges A to B of weight 2, A to C of weight 5, B to C of weight 1, B to D of weight 4 and C to D of weight 1. The shortest path A B C D costs 4.</desc>
