<text x="597.5" y="198.5" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">4 min</text>
<line x1="618.6756238993363" y1="334.2737080906328" x2="764.2108763941741" y2="259.3866364185318" stroke="#2976BD" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="695.0" y="279.0" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1 min</text>
