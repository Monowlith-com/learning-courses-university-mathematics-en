<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Convex optimisation: best feasible point</title><desc>Coordinate diagram of the convex triangular feasible set x≥0, y≥0 and x+y≤2. Desired point W=(2,1) is outside; the boundary optimum is P=(1.5,0.5). The minimum objective value is 0.5.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Convex optimisation: best feasible point</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">min (x−2)²+(y−1)²  subject to  x≥0, y≥0, x+y≤2</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="169.00" y1="518.00" x2="169.00" y2="130.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="324.00" y1="518.00" x2="324.00" y2="130.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="479.00" y1="518.00" x2="479.00" y2="130.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="634.00" y1="518.00" x2="634.00" y2="130.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="169.00" y1="518.00" x2="665.00" y2="518.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="169.00" y1="363.00" x2="665.00" y2="363.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="169.00" y1="208.00" x2="665.00" y2="208.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="169.00" y1="518.00" x2="665.00" y2="518.00" stroke="#253d59" stroke-width="2.2" stroke-linecap="round" /><polygon points="665.00,518.00 656.04,522.44 656.04,513.56" fill="#253d59" stroke="#253d59" stroke-width="0" /><line x1="169.00" y1="518.00" x2="169.00" y2="130.50" stroke="#253d59" stroke-width="2.2" stroke-linecap="round" /><polygon points="169.00,130.50 173.44,139.46 164.56,139.46" fill="#253d59" stroke="#253d59" stroke-width="0" /><text x="679" y="544" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x</text><text x="149" y="138" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">y</text><text x="169" y="545" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">0</text><text x="324" y="545" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1</text><text x="479" y="545" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">2</text><text x="634" y="545" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">3</text><text x="146" y="368" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1</text><text x="146" y="213" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">2</text><polygon points="169.00,518.00 479.00,518.00 169.00,208.00" fill="#dcecff" stroke="#286fba" stroke-width="2.7" fill-opacity="0.75" /><line x1="169.00" y1="208.00" x2="479.00" y2="518.00" stroke="#286fba" stroke-width="4" stroke-linecap="round" /><text x="305" y="245" fill="#286fba" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x+y=2</text><text x="226" y="415" fill="#286fba" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">feasible</text><circle cx="479.00" cy="363.00" r="109.60" fill="none" stroke="#bc6924" stroke-width="2.8" stroke-dasharray="7 6" /><line x1="479.00" y1="363.00" x2="401.50" y2="440.50" stroke="#b44854" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="5 4" /><circle cx="479.00" cy="363.00" r="8" fill="#ffffff" stroke="#b44854" stroke-width="3" /><circle cx="401.50" cy="440.50" r="8" fill="#ffffff" stroke="#bc6924" stroke-width="3" /><text x="496" y="349" fill="#b44854" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">W = (2, 1)</text><text x="386.5" y="479.5" fill="#bc6924" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">P = (1,5; 0,5)</text><rect x="681" y="178" width="179" height="236" fill="#ffffff" stroke="#b5c7d8" rx="10" stroke-width="1.5" /><text x="698" y="215" fill="#b44854" font-size="14" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Desired point W</text><text x="698" y="240" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">not feasible</text><text x="698" y="292" fill="#bc6924" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Optimum P</text><text x="698" y="327" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">f(P) = 0,5</text><text x="698" y="368" fill="#286fba" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Boundary minimum</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Circles represent equal costs; the smallest touching circle reaches P.</text></svg>