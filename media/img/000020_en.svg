<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Eigenvectors: direction is preserved</title><desc>Linear map with diagonal matrix diag(2,1): vector e₁ on the x-axis is doubled; e₂ on the y-axis is unchanged. Both retain their direction, with eigenvalues two and one.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Eigenvectors: direction is preserved</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">A = diag(2, 1) · Ae₁ = 2e₁ and Ae₂ = e₂</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="127.00" y1="178.00" x2="127.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="221.00" y1="178.00" x2="221.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="315.00" y1="178.00" x2="315.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="409.00" y1="178.00" x2="409.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="503.00" y1="178.00" x2="503.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="597.00" y1="178.00" x2="597.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="691.00" y1="178.00" x2="691.00" y2="540.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="90.00" y1="527.00" x2="800.00" y2="527.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="90.00" y1="433.00" x2="800.00" y2="433.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="90.00" y1="339.00" x2="800.00" y2="339.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="90.00" y1="245.00" x2="800.00" y2="245.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="90.00" y1="151.00" x2="800.00" y2="151.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="95.00" y1="433.00" x2="785.00" y2="433.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="315.00" y1="535.00" x2="315.00" y2="171.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="315.00" y1="433.00" x2="409.00" y2="433.00" stroke="#286fba" stroke-width="3" stroke-linecap="round" /><polygon points="409.00,433.00 399.24,438.08 399.24,427.92" fill="#286fba" stroke="#286fba" stroke-width="0" /><line x1="315.00" y1="433.00" x2="503.00" y2="433.00" stroke="#bc6924" stroke-width="5" stroke-linecap="round" /><polygon points="503.00,433.00 493.24,438.08 493.24,427.92" fill="#bc6924" stroke="#bc6924" stroke-width="0" /><line x1="315.00" y1="433.00" x2="315.00" y2="339.00" stroke="#286fba" stroke-width="4" stroke-linecap="round" /><polygon points="315.00,339.00 320.08,348.76 309.92,348.76" fill="#286fba" stroke="#286fba" stroke-width="0" /><circle cx="409.00" cy="433.00" r="5" fill="#ffffff" stroke="#286fba" stroke-width="2" /><text x="403" y="463" fill="#286fba" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">e₁</text><text x="520" y="418" fill="#bc6924" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Ae₁ = 2e₁</text><text x="336" y="329" fill="#286fba" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Ae₂ = e₂</text><text x="620" y="266" fill="#253d59" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">A = [ 2   0 ]</text><text x="620" y="301" fill="#253d59" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">      [ 0   1 ]</text><text x="620" y="373" fill="#253d59" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">λ₁ = 2,  λ₂ = 1</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The axes e₁ and e₂ are eigendirections of this particular matrix.</text></svg>