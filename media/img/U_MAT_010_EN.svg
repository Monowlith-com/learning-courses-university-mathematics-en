<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="A disc and an annulus differ in whether they contain a hole."><title>Topological structure and holes</title><desc>A disc and an annulus differ in whether they contain a hole.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Topological structure and holes</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="74" y="146" width="367" height="331" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><rect x="516" y="146" width="367" height="331" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="257" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#192b47">Disc</text><text x="700" y="196" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#192b47">Annulus</text><circle cx="257" cy="326" r="97" fill="#bcd9fa" stroke="#356dda" stroke-width="3"/><circle cx="700" cy="326" r="102" fill="#b8e6df" stroke="#15978f" stroke-width="3"/><circle cx="700" cy="326" r="42" fill="white" stroke="#15978f" stroke-width="3"/><text x="257" y="454" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#356dda">No hole</text><text x="700" y="454" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#15978f">One hole</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Holes cannot appear or disappear under continuous deformation without cutting or gluing.</text></svg>