<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect width="960" height="440" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#16283b"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#20679d"/></marker></defs><text x="480" y="38" text-anchor="middle" font-size="30">Orientation of a circular path</text><path d="M90 220 H390 M240 80 V350" stroke="#a0aab5"/><circle cx="240" cy="220" r="108" fill="#e4eff8" fill-opacity="0.8" stroke="#20679d" stroke-width="3"/><circle cx="240" cy="220" r="5" fill="#16283b"/><path d="M274 112 L206 112" fill="none" stroke="#20679d" stroke-width="3" marker-end="url(#arrow)"/><text x="259" y="243" text-anchor="middle" font-size="19">0</text><text x="240" y="390" text-anchor="middle" font-size="29">∮ dz/z = +2πi</text><text x="240" y="65" text-anchor="middle" font-size="21">Counterclockwise</text><path d="M570 220 H870 M720 80 V350" stroke="#a0aab5"/><circle cx="720" cy="220" r="108" fill="#e4eff8" fill-opacity="0.8" stroke="#20679d" stroke-width="3"/><circle cx="720" cy="220" r="5" fill="#16283b"/><path d="M686 112 L754 112" fill="none" stroke="#20679d" stroke-width="3" marker-end="url(#arrow)"/><text x="739" y="243" text-anchor="middle" font-size="19">0</text><text x="720" y="390" text-anchor="middle" font-size="29">∮ dz/z = −2πi</text><text x="720" y="65" text-anchor="middle" font-size="21">Clockwise</text></g></svg>