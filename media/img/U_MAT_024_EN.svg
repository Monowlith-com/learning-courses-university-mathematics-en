<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Logical timestamps follow local events and messages; they do not measure physical time."><title>Lamport clocks: ordering events</title><desc>Logical timestamps follow local events and messages; they do not measure physical time.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Lamport clocks: ordering events</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="69" y="187" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#356dda">Process A</text><line x1="219" y1="181" x2="851" y2="181" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><polygon points="851.0,181.0 840.4,186.5 840.4,175.5" fill="#586b84"/><text x="69" y="316" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#15978f">Process B</text><line x1="219" y1="310" x2="851" y2="310" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><polygon points="851.0,310.0 840.4,315.5 840.4,304.5" fill="#586b84"/><text x="69" y="446" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#8b65bf">Process C</text><line x1="219" y1="440" x2="851" y2="440" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><polygon points="851.0,440.0 840.4,445.5 840.4,434.5" fill="#586b84"/><circle cx="280" cy="181" r="9" fill="#356dda"/><text x="280" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#356dda">1</text><circle cx="370" cy="181" r="9" fill="#356dda"/><text x="370" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#356dda">2</text><circle cx="813" cy="181" r="9" fill="#356dda"/><text x="813" y="162" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#356dda">8</text><circle cx="462" cy="310" r="9" fill="#15978f"/><text x="462" y="291" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#15978f">3</text><circle cx="543" cy="310" r="9" fill="#15978f"/><text x="543" y="291" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#15978f">4</text><circle cx="629" cy="440" r="9" fill="#8b65bf"/><text x="629" y="421" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#8b65bf">5</text><circle cx="702" cy="440" r="9" fill="#8b65bf"/><text x="702" y="421" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#8b65bf">6</text><circle cx="757" cy="440" r="9" fill="#8b65bf"/><text x="757" y="421" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#8b65bf">7</text><line x1="370" y1="181" x2="462" y2="310" stroke="#ee9a32" stroke-width="3" stroke-linecap="round"/><polygon points="462.0,310.0 451.3,304.6 460.3,298.1" fill="#ee9a32"/><line x1="543" y1="310" x2="629" y2="440" stroke="#ee9a32" stroke-width="3" stroke-linecap="round"/><polygon points="629.0,440.0 618.5,434.2 627.7,428.1" fill="#ee9a32"/><line x1="757" y1="440" x2="813" y2="181" stroke="#ee9a32" stroke-width="3" stroke-linecap="round"/><polygon points="813.0,181.0 816.2,192.6 805.3,190.2" fill="#ee9a32"/><text x="501" y="489" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#586b84">Numbers = logical timestamps</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Receive: clock := max(local, received) + 1.</text></svg>