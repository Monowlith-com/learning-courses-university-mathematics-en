<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Linear transformation of a region</title><desc>The unit square with vertices (0,0), (1,0), (1,1), (0,1) is mapped to a parallelogram by matrix A.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Linear transformation of a region</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Matrix A = [[2, 1], [0, 1]]</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="137.00" y1="150.00" x2="137.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="518.00" x2="510.00" y2="518.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="225.00" y1="150.00" x2="225.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="430.00" x2="510.00" y2="430.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="313.00" y1="150.00" x2="313.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="342.00" x2="510.00" y2="342.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="401.00" y1="150.00" x2="401.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="254.00" x2="510.00" y2="254.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="489.00" y1="150.00" x2="489.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="166.00" x2="510.00" y2="166.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="105.00" y1="430.00" x2="510.00" y2="430.00" stroke="#253d59" stroke-width="1.6" stroke-linecap="round" /><line x1="225.00" y1="503.00" x2="225.00" y2="145.00" stroke="#253d59" stroke-width="1.6" stroke-linecap="round" /><line x1="507.00" y1="150.00" x2="507.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="518.00" x2="880.00" y2="518.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="595.00" y1="150.00" x2="595.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="430.00" x2="880.00" y2="430.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="683.00" y1="150.00" x2="683.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="342.00" x2="880.00" y2="342.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="771.00" y1="150.00" x2="771.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="254.00" x2="880.00" y2="254.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="859.00" y1="150.00" x2="859.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="166.00" x2="880.00" y2="166.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="475.00" y1="430.00" x2="880.00" y2="430.00" stroke="#253d59" stroke-width="1.6" stroke-linecap="round" /><line x1="595.00" y1="503.00" x2="595.00" y2="145.00" stroke="#253d59" stroke-width="1.6" stroke-linecap="round" /><polygon points="225.00,430.00 313.00,430.00 313.00,342.00 225.00,342.00" fill="#dcecff" stroke="#286fba" stroke-width="3" /><polygon points="595.00,430.00 771.00,430.00 859.00,342.00 683.00,342.00" fill="#ffe7cf" stroke="#bc6924" stroke-width="3" /><text x="225" y="145" fill="#286fba" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Before transformation</text><text x="595" y="145" fill="#bc6924" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">After applying A</text><text x="450" y="548" fill="#253d59" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">A · (x, y) = (2x + y, y)</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Regions are stretched and sheared; straight lines remain straight.</text></svg>