<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Variable Z can influence both X and Y and distort their observed relationship."><title>Causal graph with a confounder</title><desc>Variable Z can influence both X and Y and distort their observed relationship.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Causal graph with a confounder</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><circle cx="482" cy="189" r="56" fill="#f3f1fc" stroke="#8b65bf" stroke-width="4"/><text x="482" y="199" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#8b65bf">Z</text><circle cx="271" cy="397" r="56" fill="#e8f2fd" stroke="#356dda" stroke-width="4"/><text x="271" y="407" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#356dda">X</text><circle cx="699" cy="397" r="56" fill="#e7f7f5" stroke="#15978f" stroke-width="4"/><text x="699" y="407" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#15978f">Y</text><line x1="435" y1="222" x2="318" y2="357" stroke="#8b65bf" stroke-width="4" stroke-linecap="round"/><polygon points="318.0,357.0 320.8,345.3 329.2,352.6" fill="#8b65bf"/><line x1="530" y1="223" x2="654" y2="356" stroke="#8b65bf" stroke-width="4" stroke-linecap="round"/><polygon points="654.0,356.0 642.7,352.0 650.8,344.4" fill="#8b65bf"/><line x1="338" y1="397" x2="631" y2="397" stroke="#356dda" stroke-width="4" stroke-linecap="round"/><polygon points="631.0,397.0 620.4,402.5 620.4,391.5" fill="#356dda"/><text x="480" y="151" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#8b65bf">Confounder</text><text x="479" y="451" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#356dda">Possible causal effect X → Y</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Observed correlation is not automatically a causal effect.</text></svg>