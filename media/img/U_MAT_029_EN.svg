<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><rect width="960" height="440" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#16283b"><text x="480" y="43" text-anchor="middle" font-size="28" font-weight="bold">Chinese remainder theorem: projections</text><text x="150" y="95" text-anchor="middle" font-size="23" font-weight="bold">eᵢ</text><text x="370" y="95" text-anchor="middle" font-size="23" font-weight="bold">mod 3</text><text x="590" y="95" text-anchor="middle" font-size="23" font-weight="bold">mod 5</text><text x="810" y="95" text-anchor="middle" font-size="23" font-weight="bold">mod 7</text><rect x="45" y="115" width="870" height="55" rx="6" stroke="#8095a7" fill="#f4f7fb"/><text x="150" y="150" text-anchor="middle" font-size="24" font-weight="normal">70</text><rect x="323" y="120" width="94" height="45" rx="6" stroke="#8095a7" fill="#d5e9fb"/><text x="370" y="150" text-anchor="middle" font-size="24" font-weight="bold">1</text><text x="590" y="150" text-anchor="middle" font-size="24" font-weight="normal">0</text><text x="810" y="150" text-anchor="middle" font-size="24" font-weight="normal">0</text><rect x="45" y="180" width="870" height="55" rx="6" stroke="#8095a7" fill="#f4f7fb"/><text x="150" y="215" text-anchor="middle" font-size="24" font-weight="normal">21</text><text x="370" y="215" text-anchor="middle" font-size="24" font-weight="normal">0</text><rect x="543" y="185" width="94" height="45" rx="6" stroke="#8095a7" fill="#d5e9fb"/><text x="590" y="215" text-anchor="middle" font-size="24" font-weight="bold">1</text><text x="810" y="215" text-anchor="middle" font-size="24" font-weight="normal">0</text><rect x="45" y="245" width="870" height="55" rx="6" stroke="#8095a7" fill="#f4f7fb"/><text x="150" y="280" text-anchor="middle" font-size="24" font-weight="normal">15</text><text x="370" y="280" text-anchor="middle" font-size="24" font-weight="normal">0</text><text x="590" y="280" text-anchor="mi