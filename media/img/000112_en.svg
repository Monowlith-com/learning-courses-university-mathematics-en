<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Transition probabilities in a two-state model; the outgoing probabilities from each state sum to one."><title>Markov chain: operation and failure</title><desc>Transition probabilities in a two-state model; the outgoing probabilities from each state sum to one.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Markov chain: operation and failure</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><circle cx="305" cy="320" r="89" fill="#def0fc" stroke="#356dda" stroke-width="4"/><circle cx="672" cy="320" r="89" fill="#feeeda" stroke="#ee9a32" stroke-width="4"/><text x="305" y="328" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#356dda">Operational</text><text x="672" y="328" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#ee9a32">Failure</text><path d="M 375 271 Q 490 173 607 269" fill="none" stroke="#15978f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="608.0,269.0 585.0,266.0 596.0,248.0" fill="#15978f"/><path d="M 603 374 Q 489 472 377 376" fill="none" stroke="#15978f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="377.0,376.0 400.0,378.0 389.0,398.0" fill="#15978f"/><text x="485" y="210" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#15978f">0,2</text><text x="489" y="436" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#15978f">0,3</text><path d="M 226 274 C 148 166 154 407 226 365" fill="none" stroke="#356dda" stroke