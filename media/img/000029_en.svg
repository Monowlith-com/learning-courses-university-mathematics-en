<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Complex numbers in the complex plane</title><desc>Complex plane: real part three on the horizontal axis, imaginary part two on the vertical axis. The vector has magnitude √13.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Complex numbers in the complex plane</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">z = 3 + 2i as a point and a vector</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="100.00" y1="135.00" x2="100.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="184.00" y1="135.00" x2="184.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="268.00" y1="135.00" x2="268.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="352.00" y1="135.00" x2="352.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="436.00" y1="135.00" x2="436.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="520.00" y1="135.00" x2="520.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="604.00" y1="135.00" x2="604.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="688.00" y1="135.00" x2="688.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="772.00" y1="135.00" x2="772.00" y2="524.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="85.00" y1="505.00" x2="780.00" y2="505.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="85.00" y1="421.00" x2="780.00" y2="421.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="85.00" y1="337.00" x2="780.00" y2="337.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="85.00" y1="253.00" x2="780.00" y2="253.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="85.00" y1="169.00" x2="780.00" y2="169.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="80.00" y1="421.00" x2="793.00" y2="421.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="352.00" y1="525.00" x2="352.00" y2="126.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><text x="750" y="449" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Re(z)</text><text x="370" y="146" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Im(z)</text><line x1="352.00" y1="421.00" x2="604.00" y2="253.00" stroke="#286fba" stroke-width="5" stroke-linecap="round" /><line x1="604.00" y1="253.00" x2="604.00" y2="421.00" stroke="#bc6924" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><line x1="352.00" y1="421.00" x2="604.00" y2="421.00" stroke="#b5c7d8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><circle cx="604.00" cy="253.00" r="7" fill="#ffffff" stroke="#286fba" stroke-width="3" /><text x="619" y="241" fill="#286fba" font-size="23" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">3 + 2i</text><text x="604" y="446" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">3</text><text x="335" y="258" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="end">2</text><text x="604" y="350" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">|z| = √(3² + 2²)</text><text x="604" y="385" fill="#286fba" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">= √13 ≈ 3,61</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The real and imaginary parts are two coordinates of the same number.</text></svg>