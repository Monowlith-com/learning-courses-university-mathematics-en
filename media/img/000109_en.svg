<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Weighted inputs are summed and processed by an activation function."><title>An artificial neuron</title><desc>Weighted inputs are summed and processed by an activation function.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">An artificial neuron</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="71" y="191" width="160" height="70" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="113" y="234" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#356dda">x₁</text><text x="186" y="234" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#586b84">w₁</text><line x1="233" y1="226" x2="410" y2="338" stroke="#356dda" stroke-width="3" stroke-linecap="round"/><polygon points="410.0,338.0 398.0,337.0 404.0,327.6" fill="#356dda"/><rect x="71" y="291" width="160" height="70" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="113" y="334" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#15978f">x₂</text><text x="186" y="334" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#586b84">w₂</text><line x1="233" y1="326" x2="410" y2="338" stroke="#15978f" stroke-width="3" stroke-linecap="round"/><polygon points="410.0,338.0 399.0,342.8 399.8,331.8" fill="#15978f"/><rect x="71" y="391" width="160" height="70" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="113" y="434" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#ee9a32">x₃</text><text x="186" y="434" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#586b84">w₃</text><line x1="233" y1="426" x2="410" y2="338" stroke="#ee9a32" stroke-width="3" stroke-linecap="round"/><polygon points="410.0,338.0 402.9,347.7 398.0,337.8" fill="#ee9a32"/><circle cx="482" cy="337" r="79" fill="#e8f2fd" stroke="#356dda" stroke-width="4"/><text x="482" y="333" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#356dda">Σ (wᵢ · xᵢ)</text><text x="482" y="364" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#586b84">+ b</text><line x1="567" y1="337" x2="656" y2="337" stroke="#356dda" stroke-width="3" stroke-linecap="round"/><polygon points="656.0,337.0 645.4,342.5 645.4,331.5" fill="#356dda"/><rect x="668" y="279" width="204" height="120" rx="12" fill="#e8f6f2" stroke="#15978f" stroke-width="2"/><text x="770" y="331" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#15978f">Activation</text><text x="770" y="365" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#15978f">y = σ(z)</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">b is the bias; the activation function can introduce non-linearity.</text></svg>