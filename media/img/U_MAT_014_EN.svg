 stroke-width="1" /><text x="698" y="472" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">4</text><rect x="730" y="449" width="23" height="0" fill="#dce5ed" stroke="none" rx="0" stroke-width="1" /><text x="741" y="472" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">5</text><rect x="773" y="449" width="23" height="0" fill="#dce5ed" stroke="none" rx="0" stroke-width="1" /><text x="784" y="472" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">6</text><rect x="816" y="269" width="23" height="180" fill="#bc6924" stroke="none" rx="0" stroke-width="1" /><text x="827" y="472" fill="#61758a" font-size="14" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">7</text><text x="496" y="260" fill="#bc6924" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">4</text><text x="838" y="480" fill="#253d59" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">k</text><text x="670" y="511" fill="#bc6924" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">250 Hz  /  1 750 Hz*</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">* k=7 is the negative frequency −250 Hz modulo the sampling rate (DFT symmetry).</text></svg>