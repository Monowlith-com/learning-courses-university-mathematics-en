<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Fourier: time sequence and frequency spectrum</title><desc>Left: eight blue samples of a 250 Hz sine wave at a sampling rate of 2,000 Hz. Right: DFT magnitudes of four at bins k=1 and k=7, and zero at the other six bins.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Fourier: time sequence and frequency spectrum</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">250 Hz sine wave at 2,000 Hz with 8 samples</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><text x="235" y="166" fill="#253d59" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Time domain: x[n]</text><line x1="75.00" y1="345.00" x2="448.00" y2="345.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="92.00" y1="218.00" x2="92.00" y2="464.00" stroke="#253d59" stroke-width="2" stroke-linecap="round" /><line x1="92.00" y1="345.00" x2="92.00" y2="345.00" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="92.00" cy="345.00" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="92" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">0</text><line x1="140.00" y1="345.00" x2="140.00" y2="268.63" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="140.00" cy="268.63" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="140" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1</text><line x1="188.00" y1="345.00" x2="188.00" y2="237.00" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="188.00" cy="237.00" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="188" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">2</text><line x1="236.00" y1="345.00" x2="236.00" y2="268.63" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="236.00" cy="268.63" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="236" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">3</text><line x1="284.00" y1="345.00" x2="284.00" y2="345.00" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="284.00" cy="345.00" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="284" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">4</text><line x1="332.00" y1="345.00" x2="332.00" y2="421.37" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="332.00" cy="421.37" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="332" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">5</text><line x1="380.00" y1="345.00" x2="380.00" y2="453.00" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="380.00" cy="453.00" r="5" fill="#286fba" stroke="#286fba" stroke-width="2" /><text x="380" y="479" fill="#61758a" font-size="13" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">6</text><line x1="428.00" y1="345.00" x2="428.00" y2="421.37" stroke="#b5c7d8" stroke-width="1.8" stroke-linecap="round" /><circle cx="428.00" cy="421.37" r="5" fill="#286fba" str