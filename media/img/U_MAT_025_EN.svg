<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Vector search: different metrics, different results</title><desc>Coordinate plot with q=(1,1), A=(2,2), B=(1,0), and C=(−1,−1). Cosine similarity ranks A before B before C; Euclidean distance ranks B before A before C. These scores are calculated exactly in the lesson.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1" /><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1" /><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Vector search: different metrics, different results</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Query q=(1,1), data A=(2,2), B=(1,0), C=(−1,−1)</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round" /><line x1="228.00" y1="576.25" x2="228.00" y2="161.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="180.75" y1="529.00" x2="600.75" y2="529.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="333.00" y1="576.25" x2="333.00" y2="161.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="180.75" y1="424.00" x2="600.75" y2="424.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="438.00" y1="576.25" x2="438.00" y2="161.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="180.75" y1="319.00" x2="600.75" y2="319.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="543.00" y1="576.25" x2="543.00" y2="161.50" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="180.75" y1="214.00" x2="600.75" y2="214.00" stroke="#dce5ed" stroke-width="1" stroke-linecap="round" /><line x1="180.75" y1="4