ill="#253d59" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">B: 1,000</text><text x="655" y="423" fill="#253d59" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">A: 1,414</text><text x="655" y="448" fill="#253d59" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">C: 2,828</text><text x="655" y="477" fill="#bc6924" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">B  →  A  →  C</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Cosine measures direction; distance also reflects vector lengths.</text></svg>